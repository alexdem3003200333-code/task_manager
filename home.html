{% extends 'base.html' %}
{% block title %}Главная{% endblock %}
{% block content %}
  <div class="jumbotron">
    <h1>Менеджер задач</h1>
    <p>Записывайте задачи, назначайте срок и приоритет, отмечайте выполненные.</p>
    {% if user.is_authenticated %}
      <a class="btn btn-primary btn-lg" href="{% url 'tasks:list' %}">Мои задачи</a>
    {% else %}
      <a class="btn btn-primary btn-lg" href="{% url 'users:login' %}">Войти</a>
      <a class="btn btn-outline-secondary btn-lg" href="{% url 'users:register' %}">Регистрация</a>
    {% endif %}
  </div>
{% endblock %}
